version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: areal_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-areal_hr_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: